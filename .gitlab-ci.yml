# Цифровой двойник завода — CI для gitlab.com
# test → export (JSON из Python) → pages (статическая сборка на GitLab Pages)
# Необязательно: Settings → CI/CD → Variables → ANTHROPIC_API_KEY (Masked, Protected) —
# рекомендации Claude сгенерируются при сборке; ключ в опубликованный сайт не попадает.

stages: [test, export, deploy]

default:
  interruptible: true

backend-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  script:
    - cd backend
    - pip install -q -r requirements-dev.txt
    - pytest -q

export-static:
  stage: export
  image: python:3.12-slim
  cache:
    key: pip
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  script:
    - cd backend
    - pip install -q -r requirements-dev.txt   # TestClient требует httpx
    - python -m app.export_static ../frontend/public/static-api
  artifacts:
    paths: [frontend/public/static-api]
    expire_in: 1 week

pages:
  stage: deploy
  image: node:20-alpine
  needs: [export-static]
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules]
  script:
    # Подпуть сайта из CI_PAGES_URL: https://<ns>.gitlab.io/<проект> → /<проект>/,
    # уникальный домен https://<проект>-<хэш>.gitlab.io → /
    - export BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/*$##')/"
    - echo "Pages URL $CI_PAGES_URL → base $BASE_PATH"
    - cd frontend
    - npm ci --no-audit --no-fund
    - npx tsc -b
    - npx vitest run
    - npm run build:static
    - cd .. && rm -rf public && cp -r frontend/dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
