services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/app/data  # SQLite: идеи, инциденты, посещаемость переживают перезапуск
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
