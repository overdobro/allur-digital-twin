# Публикация статической версии на GitHub Pages (без сервера: ответы API выгружаются в JSON при сборке).
# Запуск вручную: Actions → Pages → Run workflow. Нужно: Settings → Pages → Source: GitHub Actions.
# Для приватного репозитория Pages доступны на платных тарифах GitHub.
# Необязательно: Settings → Secrets → ANTHROPIC_API_KEY — рекомендации Claude сгенерируются при сборке, ключ в сайт не попадает.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Экспорт ответов API в JSON
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements-dev.txt
          python -m app.export_static ../frontend/public/static-api
      - name: Статическая сборка
        working-directory: frontend
        env:
          # base_path от configure-pages: «/allur-digital-twin» или пусто для своего домена
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
